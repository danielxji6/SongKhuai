<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SongKhuai</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            background: #0f0f0f;
            color: #fff;
        }

        #player-section {
            width: 80%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #resize-handle {
            width: 5px;
            cursor: col-resize;
            background: #272727;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        #resize-handle:hover,
        #resize-handle.dragging {
            background: #555;
        }

        #sidebar {
            width: 20%;
            flex-shrink: 0;
            border-left: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        #controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #272727;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn.active {
            background: #0070f3;
            border-color: #0070f3;
        }

        .btn-skip {
            background: #e50914;
            border: none;
            font-weight: bold;
        }

        #now-playing {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #aaa;
            min-height: 20px;
        }

        #now-playing span {
            color: #fff;
            font-weight: 600;
        }

        /* Tab bar */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid #272727;
            margin-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #666;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab-btn:hover {
            color: #aaa;
        }

        .tab-btn.active {
            color: #fff;
            border-bottom-color: #0070f3;
        }

        .tab-panel {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .tab-panel.active {
            display: flex;
        }

        .song-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .song-list li {
            background: #1c1c1c;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 0.2s ease;
            transition: background 0.4s ease;
        }

        .song-list li.flash-green {
            background: rgba(34, 197, 94, 0.25);
        }

        .song-list li .song-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .song-list li .song-info .song-title-text {
            display: inline-block;
            white-space: nowrap;
        }

        .song-list li .song-info:hover .song-title-text.overflowing {
            animation: marquee-scroll var(--marquee-duration, 5s) linear infinite;
        }

        @keyframes marquee-scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(calc(-100% - 2em)); }
        }

        .song-list li .row-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .remove-btn,
        .requeue-btn,
        .top-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 4px;
            flex-shrink: 0;
            transition: color 0.15s, background 0.15s;
        }

        .remove-btn:hover {
            color: #e50914;
            background: rgba(229, 9, 20, 0.1);
        }

        .requeue-btn:hover {
            color: #0070f3;
            background: rgba(0, 112, 243, 0.1);
        }

        .top-btn:hover {
            color: #facc15;
            background: rgba(250, 204, 21, 0.1);
        }

        /* History header row */
        .history-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .btn-clear {
            background: #272727;
            color: #999;
            border: 1px solid #444;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .btn-clear:hover {
            border-color: #666;
            color: #ccc;
        }

        .btn-clear.confirming {
            background: #e50914;
            border-color: #e50914;
            color: #fff;
        }

        .history-empty {
            text-align: center;
            color: #555;
            font-size: 13px;
            padding: 32px 0;
        }

        #connection-status {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-bottom: 8px;
        }

    </style>
</head>

<body>

    <div id="player-section">
        <div id="player"></div>

        <div id="controls">
            <button class="btn btn-skip" onclick="skipSong()">Skip ⏭️</button>
        </div>

        <div id="now-playing"></div>
    </div>

    <div id="resize-handle"></div>

    <div id="sidebar">
        <div id="connection-status"></div>
        <div style="text-align: center; margin-bottom: 20px;">
            <canvas id="qr-code"></canvas>
            <p style="margin: 5px 0; font-size: 13px; color: #aaa;">Scan to search &amp; queue songs</p>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('queue')">Up Next</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
        </div>

        <div id="tab-queue" class="tab-panel active">
            <ul id="queue-list" class="song-list"></ul>
        </div>

        <div id="tab-history" class="tab-panel">
            <div class="history-header">
                <button id="clear-history-btn" class="btn-clear" onclick="handleClearHistory()">Clear History</button>
            </div>
            <ul id="history-list" class="song-list"></ul>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let playerReady = false;
        let currentSong = null;
        const queue = [];
        let history = loadHistory();
        let clearConfirming = false;
        let clearTimer = null;


        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '480',
                width: '854',
                playerVars: { 'autoplay': 1, 'controls': 1 },
                events: {
                    'onReady': () => { playerReady = true; },
                    'onStateChange': (e) => { if (e.data === 0) playNext(); }
                }
            });
        }

        function playNext() {
            // Move the finished/current song to history before advancing
            if (currentSong) {
                addToHistory(currentSong);
            }
            if (queue.length > 0) {
                currentSong = queue.shift();
                renderQueue();
                updateNowPlaying();
                player.loadVideoById(currentSong.id);
            } else {
                currentSong = null;
                updateNowPlaying();
            }
        }

        function skipSong() {
            if (currentSong) {
                addToHistory(currentSong);
            }
            if (queue.length > 0) {
                currentSong = queue.shift();
                renderQueue();
                updateNowPlaying();
                player.loadVideoById(currentSong.id);
            } else if (player && playerReady) {
                player.stopVideo();
                currentSong = null;
                updateNowPlaying();
            }
        }

        function removeFromQueue(index) {
            queue.splice(index, 1);
            renderQueue();
        }

        function updateNowPlaying() {
            const el = document.getElementById('now-playing');
            if (currentSong) {
                el.innerHTML = `🎤 Now Playing: <span>${escapeHtml(currentSong.title)}</span>`;
            } else {
                el.textContent = '';
            }
        }

        function pushToTop(index) {
            if (index <= 0) return;
            const [item] = queue.splice(index, 1);
            queue.unshift(item);
            renderQueue();
        }

        function renderQueue() {
            const list = document.getElementById('queue-list');
            list.innerHTML = queue.map((item, idx) =>
                `<li>
                    <span class="song-info"><b>#${idx + 1}</b> <span class="song-title-text">${escapeHtml(item.title)}</span></span>
                    <div class="row-actions">
                        <button class="top-btn" onclick="pushToTop(${idx})" title="Move to top">⤒</button>
                        <button class="remove-btn" onclick="removeFromQueue(${idx})" title="Remove">✕</button>
                    </div>
                </li>`
            ).join('');
            initMarquees(list);
        }

        // ---- Tab switching ----
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', (tab === 'queue' && i === 0) || (tab === 'history' && i === 1));
            });
            document.getElementById('tab-queue').classList.toggle('active', tab === 'queue');
            document.getElementById('tab-history').classList.toggle('active', tab === 'history');
            if (tab === 'history') renderHistory();
        }

        // ---- History (localStorage-backed) ----
        function loadHistory() {
            try {
                return JSON.parse(localStorage.getItem('songkhuai-history') || '[]');
            } catch { return []; }
        }

        function saveHistory() {
            localStorage.setItem('songkhuai-history', JSON.stringify(history));
        }

        function addToHistory(song) {
            // Remove any existing entry with the same video ID to avoid duplicates
            history = history.filter(h => h.id !== song.id);
            history.unshift({ id: song.id, title: song.title, ts: Date.now() });
            saveHistory();
            renderHistory();
        }

        function removeFromHistory(index) {
            history.splice(index, 1);
            saveHistory();
            renderHistory();
        }

        function requeueFromHistory(index) {
            const song = history[index];
            // Check for duplicates in currentSong and queue
            if (currentSong && currentSong.id === song.id) {
                flashHistoryRow(index, false);
                return;
            }
            if (queue.some(q => q.id === song.id)) {
                flashHistoryRow(index, false);
                return;
            }
            queue.push({ id: song.id, title: song.title });
            renderQueue();
            flashHistoryRow(index, true);
            // auto-play if idle
            if (playerReady && player && (player.getPlayerState() !== 1 && player.getPlayerState() !== 2)) {
                playNext();
            }
        }

        function flashHistoryRow(index, success) {
            const list = document.getElementById('history-list');
            const row = list.children[index];
            if (!row) return;
            row.classList.add('flash-green');
            if (!success) {
                // brief red-ish shake for duplicate
                row.style.background = 'rgba(239, 68, 68, 0.25)';
                setTimeout(() => { row.style.background = ''; row.classList.remove('flash-green'); }, 500);
                return;
            }
            setTimeout(() => row.classList.remove('flash-green'), 600);
        }

        function handleClearHistory() {
            const btn = document.getElementById('clear-history-btn');
            if (clearConfirming) {
                // Second click — actually clear
                clearTimeout(clearTimer);
                history = [];
                saveHistory();
                renderHistory();
                clearConfirming = false;
                btn.textContent = 'Clear History';
                btn.classList.remove('confirming');
            } else {
                // First click — enter confirm state
                clearConfirming = true;
                btn.textContent = 'Tap again to confirm';
                btn.classList.add('confirming');
                clearTimer = setTimeout(() => {
                    clearConfirming = false;
                    btn.textContent = 'Clear History';
                    btn.classList.remove('confirming');
                }, 3000);
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = '<li class="history-empty" style="background:none;">No history yet</li>';
                return;
            }
            list.innerHTML = history.map((item, idx) =>
                `<li>
                    <span class="song-info"><span class="song-title-text">${escapeHtml(item.title)}</span></span>
                    <div class="row-actions">
                        <button class="requeue-btn" onclick="requeueFromHistory(${idx})" title="Add back to queue">↩</button>
                        <button class="remove-btn" onclick="removeFromHistory(${idx})" title="Remove">✕</button>
                    </div>
                </li>`
            ).join('');
            initMarquees(list);
        }

        // Marquee helper: detect overflowing titles and set animation duration
        function initMarquees(container) {
            container.querySelectorAll('.song-title-text').forEach(el => {
                const parent = el.closest('.song-info');
                if (el.scrollWidth > parent.clientWidth) {
                    el.classList.add('overflowing');
                    // ~50px per second scroll speed
                    const dur = Math.max(3, el.scrollWidth / 50);
                    el.style.setProperty('--marquee-duration', dur + 's');
                } else {
                    el.classList.remove('overflowing');
                }
            });
        }

        // Initial render of history on load
        renderHistory();

        // PeerJS Connection Setup
        // Generate a stable host ID that survives page refreshes
        function getHostId() {
            let id = localStorage.getItem('songkhuai-host-id');
            if (!id) {
                id = 'sk-' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('songkhuai-host-id', id);
            }
            return id;
        }
        const peer = new Peer(getHostId());

        peer.on('open', (id) => {
            let basePath = window.location.pathname;
            if (basePath.endsWith('.html')) {
                basePath = basePath.substring(0, basePath.lastIndexOf('/') + 1);
            } else if (!basePath.endsWith('/')) {
                basePath += '/';
            }
            const joinUrl = `${window.location.origin}${basePath}controller.html?room=${id}`;
            QRCode.toCanvas(document.getElementById('qr-code'), joinUrl, { width: 140 });
            document.getElementById('connection-status').textContent = '⏳ Waiting for controllers...';
        });

        peer.on('error', (err) => {
            console.error('PeerJS error:', err);
            document.getElementById('connection-status').textContent = '🔴 Connection error — refresh to retry';
        });

        peer.on('disconnected', () => {
            document.getElementById('connection-status').textContent = '🟡 Disconnected — attempting reconnect...';
            peer.reconnect();
        });

        peer.on('connection', (conn) => {
            document.getElementById('connection-status').textContent = '🟢 Controller connected';

            conn.on('data', (data) => {
                if (data.type === 'ADD_SONG') {
                    queue.push({ id: data.videoId, title: data.title });
                    // Instantly add to history when song arrives from controller
                    addToHistory({ id: data.videoId, title: data.title });
                    renderQueue();
                    if (playerReady && player && (player.getPlayerState() !== 1 && player.getPlayerState() !== 2)) {
                        playNext();
                    }
                }
            });

            conn.on('close', () => {
                document.getElementById('connection-status').textContent = '⏳ Waiting for controllers...';
            });
        });
    </script>

    <script>
        // Draggable resize handle
        (function() {
            const handle = document.getElementById('resize-handle');
            const player = document.getElementById('player-section');
            const sidebar = document.getElementById('sidebar');
            let dragging = false;

            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                dragging = true;
                handle.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                const totalWidth = document.body.clientWidth;
                let pct = (e.clientX / totalWidth) * 100;
                pct = Math.max(10, Math.min(90, pct));
                player.style.width = pct + '%';
                sidebar.style.width = (100 - pct) + '%';
            });

            document.addEventListener('mouseup', () => {
                if (!dragging) return;
                dragging = false;
                handle.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            });
        })();
    </script>
</body>

</html>
