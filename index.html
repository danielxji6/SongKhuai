<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SongKhuai</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            background: #0f0f0f;
            color: #fff;
        }

        #player-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #sidebar {
            flex: 1;
            border-left: 1px solid #272727;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        #controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #272727;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn.active {
            background: #0070f3;
            border-color: #0070f3;
        }

        .btn-skip {
            background: #e50914;
            border: none;
            font-weight: bold;
        }

        #now-playing {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #aaa;
            min-height: 20px;
        }

        #now-playing span {
            color: #fff;
            font-weight: 600;
        }

        /* Tab bar */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid #272727;
            margin-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #666;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab-btn:hover {
            color: #aaa;
        }

        .tab-btn.active {
            color: #fff;
            border-bottom-color: #0070f3;
        }

        .tab-panel {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .tab-panel.active {
            display: flex;
        }

        .song-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .song-list li {
            background: #1c1c1c;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 0.2s ease;
        }

        .song-list li .song-info {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .song-list li .row-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }

        .remove-btn,
        .requeue-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 4px;
            flex-shrink: 0;
            transition: color 0.15s, background 0.15s;
        }

        .remove-btn:hover {
            color: #e50914;
            background: rgba(229, 9, 20, 0.1);
        }

        .requeue-btn:hover {
            color: #0070f3;
            background: rgba(0, 112, 243, 0.1);
        }

        /* History header row */
        .history-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .btn-clear {
            background: #272727;
            color: #999;
            border: 1px solid #444;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .btn-clear:hover {
            border-color: #666;
            color: #ccc;
        }

        .btn-clear.confirming {
            background: #e50914;
            border-color: #e50914;
            color: #fff;
        }

        .history-empty {
            text-align: center;
            color: #555;
            font-size: 13px;
            padding: 32px 0;
        }

        #connection-status {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-bottom: 8px;
        }

        .btn-karaoke {
            background: #1a1a2e;
            border: 1px solid #6c63ff;
            color: #b8b5ff;
            transition: all 0.2s ease;
        }

        .btn-karaoke:hover {
            background: #2a2a4e;
        }

        .btn-karaoke.active {
            background: #6c63ff;
            border-color: #6c63ff;
            color: #fff;
            box-shadow: 0 0 12px rgba(108, 99, 255, 0.4);
        }

        #channel-controls {
            display: none;
            gap: 6px;
            margin-top: 8px;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        #channel-controls.visible {
            display: flex;
        }

        .btn-channel {
            background: #1c1c1c;
            border: 1px solid #333;
            color: #999;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .btn-channel:hover {
            border-color: #666;
            color: #ccc;
        }

        .btn-channel.active {
            background: #6c63ff;
            border-color: #6c63ff;
            color: #fff;
        }

        #karaoke-hint {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 4px;
            display: none;
        }

        #karaoke-hint.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div id="player-section">
        <div id="player"></div>

        <div id="controls">
            <button class="btn btn-skip" onclick="skipSong()">Skip ⏭️</button>
            <button id="karaoke-btn" class="btn btn-karaoke" onclick="toggleKaraokeMode()" style="display:none;">🎤 Karaoke Mode</button>
        </div>

        <div id="channel-controls">
            <button class="btn-channel active" onclick="setChannel('both', this)">Both</button>
            <button class="btn-channel" onclick="setChannel('left', this)">Left 🎵</button>
            <button class="btn-channel" onclick="setChannel('right', this)">Right 🎤</button>
        </div>
        <div id="karaoke-hint">For karaoke tracks with vocals on one channel</div>

        <div id="now-playing"></div>
    </div>

    <div id="sidebar">
        <div id="connection-status"></div>
        <div style="text-align: center; margin-bottom: 20px;">
            <canvas id="qr-code"></canvas>
            <p style="margin: 5px 0; font-size: 13px; color: #aaa;">Scan to search &amp; queue songs</p>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('queue')">Up Next</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
        </div>

        <div id="tab-queue" class="tab-panel active">
            <ul id="queue-list" class="song-list"></ul>
        </div>

        <div id="tab-history" class="tab-panel">
            <div class="history-header">
                <button id="clear-history-btn" class="btn-clear" onclick="handleClearHistory()">Clear History</button>
            </div>
            <ul id="history-list" class="song-list"></ul>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let playerReady = false;
        let currentSong = null;
        const queue = [];
        let history = loadHistory();
        let clearConfirming = false;
        let clearTimer = null;

        // Karaoke Mode state
        let karaokeActive = false;
        let karaokeStream = null;
        let audioCtx = null;
        let sourceNode = null;
        let splitterNode = null;
        // 4 gain nodes for cross-routing: each source channel → both speakers
        let llGain = null; // left source → left speaker
        let lrGain = null; // left source → right speaker
        let rlGain = null; // right source → left speaker
        let rrGain = null; // right source → right speaker
        let mergerNode = null;

        // Feature detection: show karaoke button only on supported browsers
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            document.addEventListener('DOMContentLoaded', () => {
                document.getElementById('karaoke-btn').style.display = '';
            });
        }

        async function toggleKaraokeMode() {
            if (karaokeActive) {
                stopKaraokeMode();
            } else {
                await startKaraokeMode();
            }
        }

        async function startKaraokeMode() {
            try {
                // Request tab audio capture with suppressLocalAudioPlayback.
                // This is CRITICAL: it tells Chrome to suppress the YouTube player's
                // direct audio output. Without it, getDisplayMedia creates a feedback
                // loop (captures our processed output → re-processes → echo).
                karaokeStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: { suppressLocalAudioPlayback: true },
                    preferCurrentTab: true
                });

                // Check if audio track was actually shared
                const audioTracks = karaokeStream.getAudioTracks();
                if (audioTracks.length === 0) {
                    alert('No audio track was shared. Please try again and make sure to check "Share tab audio".');
                    karaokeStream.getTracks().forEach(t => t.stop());
                    karaokeStream = null;
                    return;
                }

                console.log('Karaoke: audio track captured, settings:', audioTracks[0].getSettings());

                // Stop the video track — we only need audio
                karaokeStream.getVideoTracks().forEach(t => t.stop());

                // Build the Web Audio graph with cross-routing
                // This lets us send a single source channel to BOTH speakers (mono)
                audioCtx = new AudioContext();
                await audioCtx.resume(); // CRITICAL: ensure context is not suspended
                console.log('Karaoke: AudioContext state:', audioCtx.state);

                sourceNode = audioCtx.createMediaStreamSource(karaokeStream);
                splitterNode = audioCtx.createChannelSplitter(2);
                llGain = audioCtx.createGain(); // L→L
                lrGain = audioCtx.createGain(); // L→R
                rlGain = audioCtx.createGain(); // R→L
                rrGain = audioCtx.createGain(); // R→R
                mergerNode = audioCtx.createChannelMerger(2);

                // Wire: source → splitter → 4 gain paths → merger → speakers
                sourceNode.connect(splitterNode);
                // Left source channel (splitter output 0)
                splitterNode.connect(llGain, 0);
                splitterNode.connect(lrGain, 0);
                // Right source channel (splitter output 1)
                splitterNode.connect(rlGain, 1);
                splitterNode.connect(rrGain, 1);
                // Route to merger (input 0 = left speaker, input 1 = right speaker)
                llGain.connect(mergerNode, 0, 0);
                lrGain.connect(mergerNode, 0, 1);
                rlGain.connect(mergerNode, 0, 0);
                rrGain.connect(mergerNode, 0, 1);
                mergerNode.connect(audioCtx.destination);

                // Update UI
                karaokeActive = true;
                document.getElementById('karaoke-btn').classList.add('active');
                document.getElementById('karaoke-btn').textContent = '🎤 Karaoke ON';
                document.getElementById('channel-controls').classList.add('visible');
                document.getElementById('karaoke-hint').classList.add('visible');

                // Reset channel buttons to "Both"
                setChannel('both', document.querySelector('#channel-controls .btn-channel'));

                // Listen for stream ending (user revokes permission)
                audioTracks[0].addEventListener('ended', () => {
                    stopKaraokeMode();
                });

            } catch (err) {
                console.log('Karaoke mode cancelled or failed:', err);
                // User cancelled the dialog — that's fine, just clean up
                if (karaokeStream) {
                    karaokeStream.getTracks().forEach(t => t.stop());
                    karaokeStream = null;
                }
            }
        }

        function stopKaraokeMode() {
            // Tear down audio graph
            if (sourceNode) { try { sourceNode.disconnect(); } catch(e) {} }
            if (splitterNode) { try { splitterNode.disconnect(); } catch(e) {} }
            if (llGain) { try { llGain.disconnect(); } catch(e) {} }
            if (lrGain) { try { lrGain.disconnect(); } catch(e) {} }
            if (rlGain) { try { rlGain.disconnect(); } catch(e) {} }
            if (rrGain) { try { rrGain.disconnect(); } catch(e) {} }
            if (mergerNode) { try { mergerNode.disconnect(); } catch(e) {} }
            if (audioCtx) { audioCtx.close().catch(() => {}); }
            if (karaokeStream) { karaokeStream.getTracks().forEach(t => t.stop()); }

            // Reset state
            sourceNode = splitterNode = llGain = lrGain = rlGain = rrGain = mergerNode = audioCtx = karaokeStream = null;
            karaokeActive = false;

            // Update UI
            document.getElementById('karaoke-btn').classList.remove('active');
            document.getElementById('karaoke-btn').textContent = '🎤 Karaoke Mode';
            document.getElementById('channel-controls').classList.remove('visible');
            document.getElementById('karaoke-hint').classList.remove('visible');
        }

        function setChannel(mode, clickedBtn) {
            if (!karaokeActive) return;

            // Set gains to route selected channel(s) to BOTH speakers
            switch (mode) {
                case 'left':
                    // Left source → both speakers, Right source → muted
                    llGain.gain.value = 1;
                    lrGain.gain.value = 1;
                    rlGain.gain.value = 0;
                    rrGain.gain.value = 0;
                    break;
                case 'right':
                    // Right source → both speakers, Left source → muted
                    llGain.gain.value = 0;
                    lrGain.gain.value = 0;
                    rlGain.gain.value = 1;
                    rrGain.gain.value = 1;
                    break;
                default: // both — normal stereo
                    llGain.gain.value = 1;
                    lrGain.gain.value = 0;
                    rlGain.gain.value = 0;
                    rrGain.gain.value = 1;
                    break;
            }

            // Update active button
            document.querySelectorAll('#channel-controls .btn-channel').forEach(b => b.classList.remove('active'));
            if (clickedBtn) clickedBtn.classList.add('active');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '480',
                width: '854',
                playerVars: { 'autoplay': 1, 'controls': 1 },
                events: {
                    'onReady': () => { playerReady = true; },
                    'onStateChange': (e) => { if (e.data === 0) playNext(); }
                }
            });
        }

        function playNext() {
            // Move the finished/current song to history before advancing
            if (currentSong) {
                addToHistory(currentSong);
            }
            if (queue.length > 0) {
                currentSong = queue.shift();
                renderQueue();
                updateNowPlaying();
                player.loadVideoById(currentSong.id);
            } else {
                currentSong = null;
                updateNowPlaying();
            }
        }

        function skipSong() {
            if (currentSong) {
                addToHistory(currentSong);
            }
            if (queue.length > 0) {
                currentSong = queue.shift();
                renderQueue();
                updateNowPlaying();
                player.loadVideoById(currentSong.id);
            } else if (player && playerReady) {
                player.stopVideo();
                currentSong = null;
                updateNowPlaying();
            }
        }

        function removeFromQueue(index) {
            queue.splice(index, 1);
            renderQueue();
        }

        function updateNowPlaying() {
            const el = document.getElementById('now-playing');
            if (currentSong) {
                el.innerHTML = `🎤 Now Playing: <span>${escapeHtml(currentSong.title)}</span>`;
            } else {
                el.textContent = '';
            }
        }

        function renderQueue() {
            const list = document.getElementById('queue-list');
            list.innerHTML = queue.map((item, idx) =>
                `<li>
                    <span class="song-info"><b>#${idx + 1}</b> ${escapeHtml(item.title)}</span>
                    <div class="row-actions">
                        <button class="remove-btn" onclick="removeFromQueue(${idx})" title="Remove">✕</button>
                    </div>
                </li>`
            ).join('');
        }

        // ---- Tab switching ----
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', (tab === 'queue' && i === 0) || (tab === 'history' && i === 1));
            });
            document.getElementById('tab-queue').classList.toggle('active', tab === 'queue');
            document.getElementById('tab-history').classList.toggle('active', tab === 'history');
            if (tab === 'history') renderHistory();
        }

        // ---- History (localStorage-backed) ----
        function loadHistory() {
            try {
                return JSON.parse(localStorage.getItem('songkhuai-history') || '[]');
            } catch { return []; }
        }

        function saveHistory() {
            localStorage.setItem('songkhuai-history', JSON.stringify(history));
        }

        function addToHistory(song) {
            history.unshift({ id: song.id, title: song.title, ts: Date.now() });
            saveHistory();
            renderHistory();
        }

        function removeFromHistory(index) {
            history.splice(index, 1);
            saveHistory();
            renderHistory();
        }

        function requeueFromHistory(index) {
            const song = history[index];
            queue.push({ id: song.id, title: song.title });
            renderQueue();
            // auto-play if idle
            if (playerReady && player && (player.getPlayerState() !== 1 && player.getPlayerState() !== 2)) {
                playNext();
            }
        }

        function handleClearHistory() {
            const btn = document.getElementById('clear-history-btn');
            if (clearConfirming) {
                // Second click — actually clear
                clearTimeout(clearTimer);
                history = [];
                saveHistory();
                renderHistory();
                clearConfirming = false;
                btn.textContent = 'Clear History';
                btn.classList.remove('confirming');
            } else {
                // First click — enter confirm state
                clearConfirming = true;
                btn.textContent = 'Tap again to confirm';
                btn.classList.add('confirming');
                clearTimer = setTimeout(() => {
                    clearConfirming = false;
                    btn.textContent = 'Clear History';
                    btn.classList.remove('confirming');
                }, 3000);
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = '<li class="history-empty" style="background:none;">No history yet</li>';
                return;
            }
            list.innerHTML = history.map((item, idx) =>
                `<li>
                    <span class="song-info">${escapeHtml(item.title)}</span>
                    <div class="row-actions">
                        <button class="requeue-btn" onclick="requeueFromHistory(${idx})" title="Add back to queue">↩</button>
                        <button class="remove-btn" onclick="removeFromHistory(${idx})" title="Remove">✕</button>
                    </div>
                </li>`
            ).join('');
        }

        // Initial render of history on load
        renderHistory();

        // PeerJS Connection Setup
        // Generate a stable host ID that survives page refreshes
        function getHostId() {
            let id = localStorage.getItem('songkhuai-host-id');
            if (!id) {
                id = 'sk-' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('songkhuai-host-id', id);
            }
            return id;
        }
        const peer = new Peer(getHostId());

        peer.on('open', (id) => {
            let basePath = window.location.pathname;
            if (basePath.endsWith('.html')) {
                basePath = basePath.substring(0, basePath.lastIndexOf('/') + 1);
            } else if (!basePath.endsWith('/')) {
                basePath += '/';
            }
            const joinUrl = `${window.location.origin}${basePath}controller.html?room=${id}`;
            QRCode.toCanvas(document.getElementById('qr-code'), joinUrl, { width: 140 });
            document.getElementById('connection-status').textContent = '⏳ Waiting for controllers...';
        });

        peer.on('error', (err) => {
            console.error('PeerJS error:', err);
            document.getElementById('connection-status').textContent = '🔴 Connection error — refresh to retry';
        });

        peer.on('disconnected', () => {
            document.getElementById('connection-status').textContent = '🟡 Disconnected — attempting reconnect...';
            peer.reconnect();
        });

        peer.on('connection', (conn) => {
            document.getElementById('connection-status').textContent = '🟢 Controller connected';

            conn.on('data', (data) => {
                if (data.type === 'ADD_SONG') {
                    queue.push({ id: data.videoId, title: data.title });
                    renderQueue();
                    if (playerReady && player && (player.getPlayerState() !== 1 && player.getPlayerState() !== 2)) {
                        playNext();
                    }
                }
            });

            conn.on('close', () => {
                document.getElementById('connection-status').textContent = '⏳ Waiting for controllers...';
            });
        });
    </script>
</body>

</html>
